name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' ! -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP file found in the repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted

      - name: Locate Android project root
        id: root
        shell: bash
        run: |
          set -e

          ROOT="$(find extracted -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)"

          if [ -z "$ROOT" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts inside the ZIP."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$ROOT")"

          echo "Project root: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ steps.root.outputs.project_root }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug
          else
            gradle :app:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eMAD-2FA-debug
          path: ${{ steps.root.outputs.project_root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
